

{% load static %}
<html>
<head>
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=1.9">
</head>
<body>
    <nav class="navbar">
        <div class="logo"><strong>TECH SYSTEM</strong></div>
        <ul class="nav-links">
            <li><a href="/home">Home</a></li>
            <li><a href="/aboutus">About</a></li>
            <li><a href="/contactus">Contact</a></li>
            <li><a href="/register">Register</a></li>
        </ul>
    </nav>

   <div class="container" style="max-width: 400px; margin: 40px auto;">
    <h2 style="text-align: center; color: var(--text);">User Login</h2>
    <form action="/login" style="display: flex; flex-direction: column;">
        <input type="email" name="email" placeholder="Email Address" required>
        <input type="password" name="password" placeholder="Password" required>
        
        <button type="submit" style="margin-top: 20px; width: 180px; align-self: center;">Sign In</button>
    </form>
    
    <p style="text-align: center; margin-top: 15px;">
        <a href="/register" style="color: var(--accent); text-decoration: none; font-weight: bold;">Create an Account</a>
    </p>
</div>
</body>
</html>
