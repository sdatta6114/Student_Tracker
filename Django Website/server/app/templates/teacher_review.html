<div class="container" style="max-width: 1000px; margin: auto; padding: 20px;">
    <h2>Grade Assignments</h2>
    
    <div style="display: grid; gap: 20px;">
        {% for sub in submissions %}
        <div style="background: #1e293b; border: 1px solid #334155; padding: 20px; border-radius: 12px;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                <div>
                    <h3 style="margin: 0; color: #f8fafc;">{{ sub.enrollment.student.name }}</h3>
                    <p style="color: #94a3b8; margin: 5px 0;">Course: {{ sub.enrollment.course.title }} | Batch: {{ sub.batch.batch_number }}</p>
                </div>
                <a href="{{ sub.file.url }}" target="_blank" style="background: #10b981; color: white; padding: 8px 15px; border-radius: 6px; text-decoration: none; font-weight: bold;">
                    Download File
                </a>
            </div>

            <form method="POST" style="margin-top: 15px; border-top: 1px solid #334155; padding-top: 15px;">
                {% csrf_token %}
                <input type="hidden" name="submission_id" value="{{ sub.id }}">
                
                <div style="display: flex; gap: 15px; margin-bottom: 10px;">
                    <div style="flex: 1;">
                        <label style="color: #94a3b8; font-size: 0.85rem;">Rating (0-10)</label>
                        <input type="number" name="rating" value="{{ sub.rating|default:'' }}" min="0" max="10" 
                               style="width: 100%; padding: 10px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 4px;">
                    </div>
                </div>

                <label style="color: #94a3b8; font-size: 0.85rem;">Feedback / Remarks</label>
                <textarea name="remarks" style="width: 100%; height: 80px; padding: 10px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 4px; margin-top: 5px;">{{ sub.remarks|default:'' }}</textarea>
                
                <button type="submit" style="margin-top: 10px; background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold;">
                    Submit Review
                </button>
            </form>
        </div>
        {% empty %}
        <p style="color: #94a3b8; text-align: center;">No assignments submitted yet.</p>
        {% endfor %}
    </div>
</div>
