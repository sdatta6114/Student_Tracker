<div class="container" style="max-width: 1000px; margin: auto; padding: 20px;">
    <h2>Assignment Feedback System</h2>
    
    {% for task in assignments %}
    <div style="background: #1e293b; border: 1px solid #334155; padding: 20px; border-radius: 12px; margin-bottom: 20px;">
        <div style="display: flex; justify-content: space-between;">
            <h3 style="margin: 0; color: #f8fafc;">{{ task.enrollment.student.name }}</h3>
            <span style="color: #3b82f6;">Course: {{ task.enrollment.course.title }}</span>
        </div>
        
        <p style="margin: 10px 0;">
            <a href="{{ task.file.url }}" target="_blank" style="color: #34d399; font-weight: bold; text-decoration: underline;">
                📄 Download Submission
            </a>
        </p>

        <form method="POST" style="background: #0f172a; padding: 15px; border-radius: 8px; margin-top: 15px;">
            {% csrf_token %}
            <input type="hidden" name="assignment_id" value="{{ task.id }}">
            <input type="hidden" name="submit_rating" value="true">
            
            <label style="color: #94a3b8; font-size: 0.85rem;">Rating (out of 10):</label>
            <input type="number" name="rating" min="1" max="10" required 
                   style="width: 100%; padding: 8px; margin: 5px 0 15px 0; background: #1e293b; color: white; border: 1px solid #334155;">

            <label style="color: #94a3b8; font-size: 0.85rem;">Feedback Notes:</label>
            <textarea name="feedback" placeholder="Great work, but focus on..." required
                      style="width: 100%; height: 60px; padding: 8px; background: #1e293b; color: white; border: 1px solid #334155;"></textarea>
            
            <button type="submit" style="margin-top: 10px; width: 100%; padding: 10px; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
                Submit Feedback
            </button>
        </form>
    </div>
    {% empty %}
    <p style="color: #94a3b8; text-align: center;">No pending assignments to review.</p>
    {% endfor %}
</div>
